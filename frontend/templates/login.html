<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --azul-escuro:  #0f2a4a;
      --azul-medio:   #1a4a7a;
      --azul-vivo:    #1e6fc4;
      --azul-claro:   #3a8fd4;
      --azul-suave:   #d6e8f7;

      --cinza-escuro: #2e3a4a;
      --cinza-medio:  #6b7a8d;
      --cinza-claro:  #b0bec5;
      --cinza-bg:     #f0f4f8;

      --branco:       #ffffff;

      --fonte-display: 'Sora', sans-serif;
      --fonte-corpo:   'DM Sans', sans-serif;

      --raio:   12px;
      --sombra: 0 8px 32px rgba(15, 42, 74, 0.12);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--fonte-corpo);
      background-color: var(--cinza-bg);
      background-image: radial-gradient(ellipse at 20% 10%, rgba(30, 111, 196, 0.10) 0%, transparent 50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem 4rem;
    }

    main {
      width: 100%;
      max-width: 480px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header figure {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--azul-vivo), var(--azul-escuro));
      border-radius: 14px;
      margin: 0 auto 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(30, 111, 196, 0.35);
    }

    header figure svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: var(--branco);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    header h1 {
      font-family: var(--fonte-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--azul-escuro);
      letter-spacing: -0.03em;
    }

    header p {
      margin-top: 0.4rem;
      font-size: 0.95rem;
      color: var(--cinza-medio);
      font-weight: 300;
    }

    section {
      background: var(--branco);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: var(--sombra);
      border: 1px solid rgba(30, 111, 196, 0.08);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    fieldset {
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    label {
      font-family: var(--fonte-display);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--cinza-escuro);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--cinza-claro);
      border-radius: var(--raio);
      font-family: var(--fonte-corpo);
      font-size: 0.97rem;
      color: var(--cinza-escuro);
      background: var(--cinza-bg);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
      appearance: none;
    }

    input:focus {
      border-color: var(--azul-vivo);
      background: var(--branco);
      box-shadow: 0 0 0 3px rgba(30, 111, 196, 0.15);
    }

    input:hover:not(:focus) {
      border-color: var(--azul-claro);
    }

    small {
      font-size: 1rem;
      color: #c03a2b;
      font-weight: 400;
      display: none; /* JS controlará: element.style.display = 'block' */
    }

    button {
      margin-top: 0.4rem;
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--azul-vivo), var(--azul-escuro));
      color: var(--branco);
      font-family: var(--fonte-display);
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--raio);
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(30, 111, 196, 0.4);
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(30, 111, 196, 0.45);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
        background: #ccc;
        cursor: not-allowed;
        box-shadow: none;
    }

    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--cinza-medio);
    }

    footer a {
      color: var(--azul-vivo);
      text-decoration: none;
      font-weight: 500;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Responsividade */
    @media (max-width: 520px) {
      section {
        padding: 2rem 1.25rem;
      }

      header h1 {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 360px) {
      section {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <figure>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </figure>
      <h1>Bem-vindo de volta</h1>
      <p>Acesse sua conta para continuar</p>
    </header>

    <section>
      <form method="POST">

        <fieldset>
          <label for="email">E-mail</label>
          <input type="email" placeholder="seu@email.com" name="email" id="email" required />
          <small id="emailErro">Por favor, insira um e-mail válido.</small>
        </fieldset>

        <fieldset>
          <label for="senha">Senha</label>
          <input type="password" name="senha" id="senha" placeholder="Sua senha" required />
          <small id="senhaErro">Email ou Senha inválidos.</small>
        </fieldset>

        <button type="submit">Entrar</button>

      </form>
    </section>

    <footer>
      <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
    </footer>
  </main>



<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <symbol id="check-circle-fill" fill="currentColor" viewBox="0 0 16 16">
    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
  </symbol>
  <symbol id="info-fill" fill="currentColor" viewBox="0 0 16 16">
    <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
  </symbol>
  <symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
  </symbol>
</svg>

<div id="alerta"
class="alert d-flex align-items-center d-none"
role="alert">

    <svg class="bi flex-shrink-0 me-2"
    width="24"
    height="24"
    role="img">

        <use id="iconeAlerta"></use>

    </svg>

    <div id="mensagemAlerta"></div>
</div>

<script type="module" src="/static/js/pages/login.js"></script>
</body>
</html>
